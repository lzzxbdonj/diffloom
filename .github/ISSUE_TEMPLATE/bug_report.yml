name: Bug report
description: Report a reproducible problem in JSON comparison or the workbench.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Diffloom. Use synthetic data only: do not paste credentials, private JSON, or sensitive exports. For a security vulnerability, follow SECURITY.md and report privately instead.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe the problem and the workflow it interrupted.
      placeholder: After comparing two configurations, the report…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the example used, actions taken, array matching mode, ignored paths, and active filters where relevant.
      placeholder: |
        1. Load…
        2. Select…
        3. Click Compare…
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: Minimal Before JSON
      description: Optional synthetic input. Remove real names, credentials, tokens, and other private data.
      render: json
  - type: textarea
    id: after
    attributes:
      label: Minimal After JSON
      description: Optional synthetic input paired with the Before JSON.
      render: json
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain the expected result, including paths if relevant.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include errors or screenshots only after checking them for sensitive information. Export redaction is not a complete secret detector.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 133 on Windows 11
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or source revision
      description: Commit hash, release, or date obtained, if known. For a local setup, include the Node.js version.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I used synthetic data and removed sensitive information from inputs, logs, screenshots, and attachments.
          required: true
        - label: I checked existing issues for a similar report.
          required: false
